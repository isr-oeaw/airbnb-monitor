services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      - AUTH_ENABLED=false
      - AUTH_USER=airbnb
      - AUTH_PASSWORD=changeme
    depends_on:
      logger:
        condition: service_healthy
    restart: unless-stopped

  logger:
    build: ./server
    volumes:
      - ./data/logs:/data
    environment:
      - LOG_FILE=/data/address-searches.jsonl
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - LOG_API_ORIGIN=http://logger:3001
    depends_on:
      logger:
        condition: service_healthy

volumes:
  node_modules:
